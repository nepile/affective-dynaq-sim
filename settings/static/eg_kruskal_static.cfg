# ==============================================================================
# Affective Dyna-Q Simulation Configuration File
# Format: key = value organized by sections
# ==============================================================================

[environment]
# Obstacle generator: 'kruskal' (Randomized Kruskal) or 'cellular_automata'
generator = kruskal

# Dimensions of the grid (minimum 3x3)
height = 31
width = 31

# Multi-fixed independent seeds (comma separated or list format)
seeds = 1, 3

# Environment type: 'classic_va' (affective monitored), 'standard', or 'ann'
env_type = classic_va

# Maximum allowable steps per episode before truncation
max_steps = 2000

# Rewards
goal_reward = 100.0
collision_reward = -1
step_reward = -0.1


[affect]
# Discrete dynamical slope parameters (from Feldmaier & Diepold 2014, Table I)
# nu: slope for wall collision frequency f_col
nu = 0.2

# theta1: slope for direction change frequency f_dir
theta1 = 0.2

# theta2: slope for goal line-of-sight frequency f_goal

theta2 = 0.2
# kappa: slope for distance progression frequency f_right
kappa = 0.15

# Whether to bias environment rewards using positive valence (Exp 2 in paper)
# False for Neville Jeremy's research (affects parameter modulation, not rewards)
bias_reward_with_affect = false


[exploration]
# Exploration strategy: 'epsilon_greedy'
strategy = epsilon_greedy

# Exploration mode: 'static' or 'exponential_decay' ('adaptive_va' reserved for classic_va)
mode = static

# Epsilon parameter for static mode
epsilon = 0.1


[agent]
# Reinforcement learning algorithm
algorithm = dyna_q

# Number of learning episodes per seed
episodes = 200

# Learning rate mode: 'static' or 'exponential_decay' ('adaptive_va' reserved for classic_va)
alpha_mode = static

# Alpha parameter for static mode (Table I in paper)
alpha = 0.01

# Discount factor and planning steps (Table I in paper)
gamma = 0.95
planning_steps = 50


[evaluation]
# Learning evaluation phase ratio: 80% initial phase and 20% stable phase (e.g. 160 vs 40 episodes for 200 total)
initial_phase_ratio = 0.8


[system]
# Name of configuration / experiment used for grouping reports and metrics
group_name = experiment1

experiment_name = eg_kruskal_static

# Save visual PNG image of maze with obstacles, start, and goal
save_env_images = true

# Whether to save environment image inside experiment sub-folder (true -> reports/<experiment_name>/environment/*)
# or in separate gridworld folder (false -> reports/gridworld/<generator>/*)
save_env_in_experiment_dir = true

# Output folder for images and simulation metrics
reports_dir = reports

# GUI Window Configuration (options: 'auto' or integer pixel values)
# gui_cell_size: pixel size per grid cell (e.g. 15, 20). If 'auto', calculated dynamically.
gui_cell_size = auto
# Explicit GUI window dimensions (e.g. gui_window_width = 800, gui_window_height = 550)
# Leave as 'auto' to size window automatically according to cell_size and grid size.
gui_window_width = 1200
gui_window_height = 750
# Width of the right-hand HUD information sidebar in pixels
gui_sidebar_width = 250
